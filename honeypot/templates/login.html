<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Nexus Corporate Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo svg { width: 26px; height: 26px; }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06);
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
    }

    .forgot:hover { text-decoration: underline; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    button[type="submit"]:hover  { opacity: 0.93; }
    button[type="submit"]:active { transform: scale(0.99); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #9ca3af;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .sso-btn {
      width: 100%;
      padding: 11px;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.12s;
      margin-bottom: 10px;
    }

    .sso-btn:hover { background: #f8fafc; }

    .footer-text {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      margin-top: 24px;
    }

    .footer-text a { color: #6b7280; }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <span class="brand-name">Nexus Corporate</span>
  </div>

  <div class="card">
    <h1>Sign in to your account</h1>
    <p class="subtitle">Enter your credentials to access the portal</p>

    <form method="POST" action="/login" autocomplete="on">
      <label for="email">Work email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@company.com"
        required
        autocomplete="email"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
      />

      <div class="row">
        <label class="remember">
          <input type="checkbox" name="remember" value="1" />
          Keep me signed in
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <div class="divider">or continue with</div>

    <button class="sso-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#4285F4" d="M44.5 20H24v8.5h11.9C34.2 33.6 29.7 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l6-6C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.5-4z"/>
      </svg>
      Sign in with Google SSO
    </button>

    <button class="sso-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#0078d4">
        <path d="M11.4 24H0V12.6L11.4 24zM12.6 24H24V12.6L12.6 24zM0 11.4V0l11.4 11.4H0zM12.6 11.4L24 0v11.4H12.6z"/>
      </svg>
      Sign in with Microsoft
    </button>
  </div>

  <p class="footer-text">
    &copy; 2024 Nexus Corporate &nbsp;·&nbsp;
    <a href="#">Privacy</a> &nbsp;·&nbsp;
    <a href="#">Terms</a>
  </p>

</body>
</html>
