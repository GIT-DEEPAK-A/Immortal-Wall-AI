<!-- honeypot/templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Immortal Wall AI 🛡️ - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0B0B0B;
            color: #FFD700;
        }
        .header {
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border-bottom: 2px solid #D4AF37;
        }
        .content {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
        }
        .card {
            background-color: #1A1A1A;
            border: 1px solid #D4AF37;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 0 20px #FFD700;
            transform: scale(1.05);
        }
        h2 {
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">Immortal Wall AI 🛡️ - Fake Dashboard</div>
    <div class="content">
        <div class="card">
            <h2>Users</h2>
            <ul>
                {% for user in data.users %}
                    <li>{{ user }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="card">
            <h2>Files</h2>
            <ul>
                {% for file in data.files %}
                    <li>{{ file }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="card">
            <h2>Settings</h2>
            <ul>
                {% for setting in data.settings %}
                    <li>{{ setting }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
